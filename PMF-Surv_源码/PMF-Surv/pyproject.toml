[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "restot-surv"
version = "0.1.0"
description = "Progressive multimodal fusion for OS and PFS prediction."
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "nibabel",
  "scipy",
  "torch",
  "monai>=1.3,<1.4",
  "lifelines",
  "scikit-survival",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
